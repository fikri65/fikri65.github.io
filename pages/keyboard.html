<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Catalog | GEARPRO</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@500;900&display=swap"
      rel="stylesheet"
    />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <link rel="stylesheet" href="../css/categories.css" />
    <link rel="stylesheet" href="../css/style.css" />

    <script src="../src/categories/keyboard.js"></script>
  </head>
  <body x-data="keyboardProducts">
    <nav>
      <a href="#" class="logo">GEARPRO</a>
      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="hamburger">
        <span></span><span></span><span></span>
      </label>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../index.html#categories">Categories</a>
      </div>
    </nav>

    <header class="hero-category">
      <h1>KEYBOARD CATALOG</h1>
      <p>Gasket Mount, Aluminum, and Wireless Selections.</p>
    </header>

    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="Search by name or category (e.g. 'Aula', 'Wired')..."
        x-model="searchQuery"
      />
    </div>

    <section class="container">
      <div class="grid">
        <template x-for="kb in filteredKeyboards" :key="kb.id">
          <div class="card">
            <div class="category-tag" x-text="kb.category"></div>
            <img
              :src="kb.img"
              :alt="kb.name"
              onerror="this.src='https://placehold.co/600x400/111/00f2ff?text=Keyboard+Image'"
            />
            <div class="card-body">
              <h3 x-text="kb.name"></h3>
              <button class="btn-detail" @click="openModal(kb)">
                SPEC DETAILS
              </button>
            </div>
          </div>
        </template>
      </div>

      <div class="no-results" x-show="filteredKeyboards.length === 0">
        Keyboard not found. Try another keyword.
      </div>
    </section>

    <div
      class="modal-overlay"
      x-show="showModal"
      x-transition.opacity
      style="display: none"
      @click.away="showModal = false"
    >
      <div class="modal-content" @click.stop>
        <span class="close-modal" @click="showModal = false">&times;</span>

        <div class="modal-grid" x-show="selected">
          <div class="modal-image">
            <img
              :src="selected?.img"
              :alt="selected?.name"
              onerror="this.src='https://placehold.co/600x400/111/00f2ff?text=Keyboard+Image'"
            />
          </div>
          <div class="modal-info">
            <h2 x-text="selected?.name"></h2>
            <p>Rank: <span x-text="'Tier ' + selected?.tier"></span></p>
            <table class="spec-table">
              <template x-if="selected">
                <template x-for="(value, label) in selected.specs" :key="label">
                  <tr>
                    <td class="spec-label" x-text="label"></td>
                    <td class="spec-value" x-text="value"></td>
                  </tr>
                </template>
              </template>
            </table>
            <div class="aff-btns">
              <a :href="selected?.link || '#'" target="_blank" class="shopee"
                >SHOPEE OFFICIAL</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="footer-grid">
        <div class="footer-col">
          <div class="logo">GEARPRO</div>
          <p>Panduan terpercaya untuk gear gaming Anda.</p>
        </div>
        <div class="footer-col">
          <h4>Navigasi</h4>
          <a href="../index.html">Home</a>
          <a href="../index.html#choose">Why Us</a>
          <a href="../index.html#tier-builder">Tier List</a>
        </div>
        <div class="footer-col">
          <h4>Social</h4>
          <a href="#">Instagram</a>
          <a href="#">Discord</a>
          <a href="#">TikTok</a>
        </div>
      </div>
      <div class="disclaimer">&copy; 2025 GEARPRO</div>
    </footer>
  </body>
</html>
